  responses:
    BadRequest:
      description: Requisição inválida (validação/JSON/parâmetros)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito (duplicidade ou registro em uso)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Regra de negócio ou referência inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Limite de requisições excedido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

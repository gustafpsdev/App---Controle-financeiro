openapi: 3.0.3
info:
  title: TravelCash API
  version: 2.0.0
  description: >-
    API REST do **TravelCash — Controle Financeiro para Viagens** (FIAP • CP2).


    **Padrão de resposta**: `{ success, data, meta? }` em sucesso e `{
    success:false, error:{ code, message, details? } }` em erro.


    **Listagens** aceitam `page`, `limit` (máx. 100, padrão 20), `sort` (prefixo
    `-` = decrescente) e `search`; filtros específicos de cada recurso estão
    descritos nos parâmetros.


    **IA (LLM)**: endpoints em *IA* usam Gemini ou Claude quando há chave
    configurada; caso contrário respondem com regras locais (`source:
    "regras"`).
  license:
    name: Uso acadêmico — FIAP
servers:
  - url: /
    description: Servidor atual
tags:
  - name: Sistema
  - name: Dashboard
  - name: IA
    description: Funcionalidades baseadas em LLM
  - name: Usuários
  - name: Viagens
  - name: Orçamentos
  - name: Categorias
  - name: Despesas
  - name: Roteiro
  - name: Transportes
  - name: Seguros
  - name: Metas
  - name: Alertas

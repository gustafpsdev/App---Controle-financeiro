components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    search:
      name: search
      in: query
      description: Busca textual (LIKE)
      schema:
        type: string
    tripId:
      name: tripId
      in: query
      description: Filtra pela viagem
      schema:
        type: integer
        minimum: 1
  schemas:
    Meta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        sort:
          type: string
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dados inválidos na requisição.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    Insights:
      type: object
      properties:
        tripId:
          type: integer
        source:
          type: string
          enum:
            - llm
            - regras
        model:
          type: string
          nullable: true
          example: gemini-2.5-flash
        cached:
          type: boolean
        generatedAt:
          type: string
          format: date-time
        fallbackReason:
          type: string
        dataSent:
          type: object
          description: Dados agregados enviados ao modelo (sem dados pessoais)
        insights:
          type: object
          properties:
            resumo:
              type: string
            saude:
              type: string
              enum:
                - boa
                - atencao
                - critica
            pontosDeAtencao:
              type: array
              items:
                type: string
            recomendacoes:
              type: array
              items:
                type: string
            previsao:
              type: string
    Classification:
      type: object
      properties:
        category:
          type: string
          example: Alimentação
        confidence:
          type: number
          example: 0.92
        reason:
          type: string
          example: Refeição em restaurante.
        source:
          type: string
          enum:
            - llm
            - regras
        model:
          type: string
          nullable: true
    Users:
      type: object
      required:
        - name
        - email
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 160
        avatar:
          type: string
          maxLength: 4
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 1
        name: Giovanna Pereira
        email: giovanna@travelcash.local
        avatar: GP
    UsersInput:
      type: object
      required:
        - name
        - email
